name: IDX Market Scans
on:
  workflow_dispatch:
  schedule:
    - cron: "45 9,13,15,18 * * 1-4"
      timezone: "Asia/Jakarta"
    - cron: "45 9,14,15,18 * * 5"
      timezone: "Asia/Jakarta"
permissions:
  contents: write
concurrency:
  group: idx-daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Run screener
        run: python screener.py --require-today
      - name: Build website data
        run: python build_site.py
      - name: Save history, stock list and website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.csv data/excluded_tickers.json history/ docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "Save IDX market scan results"
            git push
          fi
